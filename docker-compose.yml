# ═══════════════════════════════════════════════════════════════════════════
#  HoneyBot-IoT  —  full stack (v0.8 · device machines + real restricted shell)
#  COMSATS University Islamabad  |  SP23-BCT-001 / SP23-BCT-003
#
#  Each emulated IoT device is its OWN machine (container) on the honeynet, with
#  its own hostname / IP / MAC, serving exactly that device's protocols:
#
#    cctv-machine       RTSP :554 · HTTP/HTTPS :8080/:8443        (Boa IP camera)
#    smartlock-machine  SSH :2222 · MQTT :1883 · HTTP :8081       (SecureHome hub)
#    sensor-machine     Telnet :2323 · Modbus :502 · HTTP :8082   (ISN-4000 node)
#
#  On a successful SSH/Telnet login the attacker gets a REAL but heavily
#  restricted BusyBox shell: the `sandbox` service starts a throw-away device
#  machine (vm/Dockerfile) with no network, read-only root, tmpfs, and CPU /
#  memory / process / time limits, and destroys it at logout. Set SHELL_MODE=fake
#  to use the in-process emulated shell instead.
#
#  Networks
#    honeynet : internet-facing device machines (published ports). Every
#               connection a machine ORIGINATES is dropped by the `firewall`.
#    backnet  : internal only — DB, Redis, API, intel, sandbox, backup.
#    frontnet : Nginx only — publishes the dashboard on :80.
#    egress   : intel engine only — Telegram / SMTP alerts and reports.
#
#  Quick start:   cp .env.example .env   (edit it)   &&   docker compose up -d --build
#  Dashboard:     http://localhost/   (login printed by: docker compose logs auth-init)
#  Monitoring:    docker compose --profile monitoring up -d
#  Simulator:     docker compose --profile sim up --build attacker
# ═══════════════════════════════════════════════════════════════════════════

networks:
  honeynet:
    name: honeybot_honeynet
    driver: bridge
    ipam:
      config:
        - subnet: ${HONEYNET_SUBNET:-172.31.66.0/24}
  backnet:
    name: honeybot_backnet
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${BACKNET_SUBNET:-172.31.67.0/24}
  frontnet:
    name: honeybot_frontnet
    driver: bridge
  egress:
    name: honeybot_egress
    driver: bridge

volumes:
  pgdata:
  honey_data:    # per-machine writable data (SSH host key, TLS certificate)
  captures:      # QUARANTINE: captured malware samples (mode 0400, never executed)
  nginx_auth:    # bcrypt dashboard credentials written by auth-init
  prometheus_data:
  grafana_data:
  vm_ipc:        # per-session device-control FIFOs shared with the sandbox machines
    name: honeybot_vm_ipc

# ── a device machine: runs one device's protocol front-ends (device_machine.py) ──
x-machine: &machine
  build: { context: ., dockerfile: Dockerfile.honeypot }
  image: honeybot/honeypot:0.8
  restart: unless-stopped
  env_file: .env
  entrypoint: ["python", "device_machine.py"]
  environment:
    CAPTURE_DIR: /app/captures
    SANDBOX_HOST: sandbox
    SANDBOX_IPC_DIR: /run/vm-ipc
  networks: [honeynet, backnet]
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_started }
    firewall: { condition: service_healthy }
    sandbox: { condition: service_healthy }
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  read_only: true
  tmpfs: ["/tmp"]
  volumes: ["honey_data:/app/data", "captures:/app/captures", "vm_ipc:/run/vm-ipc"]
  deploy:
    resources:
      limits: { cpus: "1.0", memory: 384M }

x-backend: &backend
  build: { context: ., dockerfile: Dockerfile.api }
  image: honeybot/api:0.8
  restart: unless-stopped
  env_file: .env
  environment:
    CAPTURE_DIR: /app/captures
  volumes: ["./geoip:/app/geoip:ro", "captures:/app/captures:ro"]
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_started }

services:
  # ── data stores (internal only) ───────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: honeybot_db
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [backnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.2-alpine
    container_name: honeybot_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb",
              "--maxmemory-policy", "allkeys-lru", "--protected-mode", "no"]
    networks: [backnet]

  # ── outbound isolation (host firewall, fail-closed) ───────────────────────
  firewall:
    build: { context: ., dockerfile: Dockerfile.firewall }
    image: honeybot/firewall:0.8
    container_name: honeybot_firewall
    restart: unless-stopped
    network_mode: host
    cap_drop: ["ALL"]
    cap_add: ["NET_ADMIN", "NET_RAW"]
    environment:
      HONEYNET_SUBNET: ${HONEYNET_SUBNET:-172.31.66.0/24}
      BACKNET_SUBNET: ${BACKNET_SUBNET:-172.31.67.0/24}
      HONEYBOT_FIREWALL: ${HONEYBOT_FIREWALL:-on}
    healthcheck:
      test: ["CMD", "/usr/local/bin/firewall.sh", "check"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  # ── sandbox: throw-away device machines for the real restricted shell ─────
  #   The ONLY service that talks to the Docker daemon. It builds the per-device
  #   machine images (vm/) on first start and creates one locked-down, network-
  #   less container per attacker session.
  sandbox:
    build: { context: ., dockerfile: Dockerfile.sandbox }
    image: honeybot/sandbox:0.8
    container_name: honeybot_sandbox
    restart: unless-stopped
    env_file: .env
    environment:
      SANDBOX_IPC_VOLUME: honeybot_vm_ipc
      SANDBOX_IPC_HOSTDIR: /srv/vm-ipc
      VM_BUILD_CONTEXT: /app/vm
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - vm_ipc:/srv/vm-ipc          # root pre-creates each session's 0777 FIFO dir here
    networks: [backnet]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import socket; socket.create_connection(('127.0.0.1',7070),timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ── device state manager (shared emulated-device state) ───────────────────
  device_state:
    <<: *machine
    container_name: honeybot_state
    entrypoint: ["python", "device_state/device_state.py"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    networks: [backnet]            # no attacker traffic, internal only

  # ── device machines (one container per device, its protocols only) ────────
  cctv-machine:
    <<: *machine
    container_name: honeybot_cctv
    hostname: IPC-HFW2431S
    environment:
      DEVICE: cctv
      CAPTURE_DIR: /app/captures
      SANDBOX_HOST: sandbox
      SANDBOX_IPC_DIR: /run/vm-ipc
      RTSP_PORT: 8554
    ports: ["8080:8080", "8443:8443", "554:8554"]

  smartlock-machine:
    <<: *machine
    container_name: honeybot_smartlock
    hostname: smartlock
    environment:
      DEVICE: smartlock
      CAPTURE_DIR: /app/captures
      SANDBOX_HOST: sandbox
      SANDBOX_IPC_DIR: /run/vm-ipc
    ports: ["2222:2222", "1883:1883", "8081:8081"]

  sensor-machine:
    <<: *machine
    container_name: honeybot_sensor
    hostname: sensor-node
    environment:
      DEVICE: sensor
      CAPTURE_DIR: /app/captures
      SANDBOX_HOST: sandbox
      SANDBOX_IPC_DIR: /run/vm-ipc
      MODBUS_PORT: 1502             # unprivileged inside the container (cap_drop ALL)
    ports: ["2323:2323", "502:1502", "8082:8082"]

  # ── API (REST + WebSocket) and threat-intelligence engine ─────────────────
  api:
    <<: *backend
    container_name: honeybot_api
    command: ["python", "-m", "uvicorn", "api.api:app", "--host", "0.0.0.0", "--port", "5000",
              "--proxy-headers", "--forwarded-allow-ips", "*"]
    networks: [backnet]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:5000/api/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  intel:
    <<: *backend
    container_name: honeybot_intel
    command: ["python", "intel/engine.py"]
    networks: [backnet, egress]    # egress: Telegram / SMTP for alerts and daily reports

  # ── dashboard: login init + Nginx (the ONLY public web entry) ─────────────
  auth-init:
    image: httpd:2.4-alpine
    container_name: honeybot_auth_init
    env_file: .env
    entrypoint: ["/bin/sh", "/deploy/auth-init.sh"]
    volumes:
      - nginx_auth:/auth
      - ./deploy/auth-init.sh:/deploy/auth-init.sh:ro
    network_mode: none
    restart: "no"

  nginx:
    build: { context: ., dockerfile: Dockerfile.dashboard }
    image: honeybot/dashboard:0.8
    container_name: honeybot_nginx
    restart: unless-stopped
    ports: ["${DASHBOARD_PORT:-80}:80"]
    volumes:
      - nginx_auth:/etc/nginx/auth:ro
    networks: [frontnet, backnet]
    depends_on:
      auth-init: { condition: service_completed_successfully }
      api: { condition: service_healthy }

  # ── scheduled backups → ./backups (pg_dump + samples, SHA-256 verified) ───
  backup:
    image: postgres:16-alpine
    container_name: honeybot_backup
    restart: unless-stopped
    env_file: .env
    entrypoint: ["/bin/sh", "/deploy/backup.sh"]
    command: ["loop"]
    volumes:
      - ./backups:/backups
      - captures:/app/captures:ro
      - ./deploy/backup.sh:/deploy/backup.sh:ro
    networks: [backnet]
    depends_on:
      db: { condition: service_healthy }

  # ── monitoring (optional):  docker compose --profile monitoring up -d ─────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: honeybot_prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks: [backnet, frontnet]
    ports: ["127.0.0.1:9090:9090"]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: honeybot_cadvisor
    profiles: ["monitoring"]
    restart: unless-stopped
    privileged: true
    devices: ["/dev/kmsg"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [backnet]

  grafana:
    image: grafana/grafana:11.1.0
    container_name: honeybot_grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change_me_grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks: [backnet, frontnet]
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]

  # ── attack simulator (lab testing only; `--profile sim`) ──────────────────
  attacker:
    build: { context: ., dockerfile: Dockerfile.attacker }
    image: honeybot/attacker:0.8
    profiles: ["sim"]
    networks: [honeynet]
    command: ["--confirm-own-honeypot",
              "--host", "smartlock-machine", "--telnet-host", "sensor-machine",
              "--mqtt-host", "smartlock-machine", "--rtsp-host", "cctv-machine",
              "--http-host", "cctv-machine", "--lock-host", "smartlock-machine",
              "--sensor-host", "sensor-machine", "--modbus-host", "sensor-machine"]
