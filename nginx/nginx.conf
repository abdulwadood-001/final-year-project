worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    upstream api_backend { server api:5000; }

    # rate-limit the API a little so a scraper can't hammer it
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # credentials are generated by the auth-init service into the nginx_auth volume
        auth_basic           "HoneyBot-IoT";
        auth_basic_user_file /etc/nginx/auth/.htpasswd;

        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        # the dashboard is fully self-contained (bundled fonts, offline world map)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # single-page app: every client-side route falls back to index.html
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
            add_header X-Frame-Options DENY always;
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        }

        # content-hashed build assets can be cached forever
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        # live push (events / detections / device state)
        location = /api/ws {
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host $host;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 120s;
        }

        # unauthenticated liveness probe (returns only {"status":"ok",...})
        location = /healthz {
            auth_basic off;
            proxy_pass http://api_backend/api/health;
        }
    }
}
