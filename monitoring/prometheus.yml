# HoneyBot-IoT — Prometheus (scope M7 resource monitoring)
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files: ["/etc/prometheus/alerts.yml"]

scrape_configs:
  - job_name: honeybot-api          # application metrics: events, sessions, detections, service heartbeats
    metrics_path: /api/metrics
    static_configs:
      - targets: ["api:5000"]
  - job_name: cadvisor               # per-container CPU / memory / network / disk I/O
    static_configs:
      - targets: ["cadvisor:8080"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
